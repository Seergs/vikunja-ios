pre-commit:
  parallel: true
  commands:
    no-main-commit:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "direct commit to main is not allowed. Create a branch instead."
          exit 1
        fi
    swiftformat:
      glob: "*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --strict {staged_files}
